name: Submit to eas to submit to Play Store

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    #auth to eas
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_ENV: "staging"
    
    #submit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Call eas build
        run: npx eas build  --profile staging --platform android --auto-submit-with-profile staging